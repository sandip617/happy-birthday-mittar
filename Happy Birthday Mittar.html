<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>শুভ জন্মদিন · Birthday Wish Maker</title>
<meta name="description" content="Make a Bangla / English birthday wish card or animation video. No login, no server.">
<meta name="theme-color" content="#e8467c">
<!-- If the URL carries a saved wish (?w=...), hide the builder before anything paints -->
<script>if (/[?&]w=/.test(location.search)) document.documentElement.classList.add('share-mode');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atma:wght@500;700&family=Baloo+Da+2:wght@400;600;800&family=Galada&family=Hind+Siliguri:wght@300;400;600;700&family=Mina:wght@400;700&family=Monoton&family=Tiro+Bangla:ital@0;1&display=swap">

<style>
/* =====================================================================
   CSS PART 1 — BASE / BUILDER UI
   ===================================================================== */
:root{
  --ui-bg:#fff8f3; --ui-card:#ffffff; --ui-text:#2b2233; --ui-sub:#6d6377;
  --ui-pri:#e8467c; --ui-pri-d:#c9306a; --ui-pri2:#ff8a5c; --ui-line:#f1e3ea;
  --ui-soft:#fff0f5; --radius:16px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ui-bg); color:var(--ui-text);
  font-family:'Hind Siliguri','Baloo Da 2',system-ui,sans-serif; font-size:16px; line-height:1.5;
}
body.lock{overflow:hidden}
.share-mode #intro, .share-mode #app, .share-mode .jump-preview{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ui-pri)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.4em;
  min-height:46px; padding:.55em 1.1em; border-radius:999px; border:1.5px solid var(--ui-line);
  background:#fff; color:var(--ui-text); font-weight:600; cursor:pointer; text-decoration:none;
  transition:transform .15s, background .15s, box-shadow .15s; -webkit-tap-highlight-color:transparent;
}
.btn:hover{background:var(--ui-soft)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--ui-pri),var(--ui-pri2));color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(232,70,124,.3)}
.btn-primary:hover{background:linear-gradient(135deg,var(--ui-pri-d),var(--ui-pri))}
.btn-lg{font-size:1.15rem;padding:.7em 1.6em}
.btn-sm{min-height:38px;padding:.35em .9em;font-size:.92rem}
.btn-wa{background:#25d366;color:#fff;border-color:transparent}
.btn-wa:hover{background:#1ebe5a}
.btn-fb{background:#1877f2;color:#fff;border-color:transparent}
.btn-fb:hover{background:#0f63d1}

/* ---------- language switch ---------- */
.lang-switch{display:inline-flex;background:#fff;border:1.5px solid var(--ui-line);border-radius:999px;padding:3px}
.lang-switch button{border:0;background:transparent;border-radius:999px;padding:.3em .85em;cursor:pointer;font-weight:600;min-height:34px}
.lang-switch button[aria-pressed="true"]{background:var(--ui-pri);color:#fff}

/* ---------- top bar & layout ---------- */
.topbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:10px 16px; background:rgba(255,248,243,.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--ui-line);
}
.brand{font-family:'Galada','Baloo Da 2',cursive;font-size:1.45rem;color:var(--ui-pri);white-space:nowrap}
.layout{max-width:1200px;margin:0 auto;padding:16px;display:grid;gap:16px}
@media (min-width:920px){
  .layout{grid-template-columns:minmax(0,1fr) minmax(0,470px);align-items:start}
  .preview{position:sticky;top:72px;max-height:calc(100vh - 88px);overflow:auto}
}
.panel{background:var(--ui-card);border:1px solid var(--ui-line);border-radius:22px;padding:18px;box-shadow:0 4px 20px rgba(120,60,90,.06)}
fieldset{border:0;margin:0 0 6px;padding:0 0 18px;border-bottom:1px dashed var(--ui-line)}
fieldset:last-child{border-bottom:0;padding-bottom:0}
legend{font-family:'Baloo Da 2',sans-serif;font-weight:800;font-size:1.15rem;color:var(--ui-pri);padding:0;margin-bottom:8px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.label{font-weight:600;font-size:.95rem}
.req{color:var(--ui-pri)}
.grid2{display:grid;gap:0 12px}
@media (min-width:560px){.grid2{grid-template-columns:1fr 1fr}}
input[type=text],select,textarea{
  width:100%; min-height:46px; padding:.6em .8em; border:1.5px solid var(--ui-line); border-radius:12px;
  background:#fff; font-size:16px; outline:none; transition:border-color .15s, box-shadow .15s;
}
textarea{min-height:96px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--ui-pri);box-shadow:0 0 0 3px rgba(232,70,124,.15)}
.invalid{border-color:#e03131!important;box-shadow:0 0 0 3px rgba(224,49,49,.15)!important}
.err{color:#e03131;font-size:.88rem}
.hint{color:var(--ui-sub);font-size:.86rem;margin:2px 0 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.space-between{justify-content:space-between}
.tone{display:inline-block;background:var(--ui-soft);color:var(--ui-pri-d);border-radius:999px;padding:.15em .7em;font-size:.85rem;font-weight:600}
.file-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* ---------- theme picker ---------- */
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:640px){.theme-grid{grid-template-columns:repeat(6,1fr)}}
.theme-opt{cursor:pointer;text-align:center;font-size:.85rem;font-weight:600}
.theme-opt input{position:absolute;opacity:0;pointer-events:none}
.theme-opt .sw{
  position:relative;display:grid;place-items:center;aspect-ratio:1;border-radius:14px;margin-bottom:4px;
  border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);overflow:hidden;transition:transform .15s;
}
.theme-opt .sw b{font-size:1.6rem;line-height:1}
.theme-opt .sw em{font-style:normal;font-size:.95rem;line-height:1}
.theme-opt .sw i{position:absolute;bottom:6px;width:10px;height:10px;border-radius:50%}
.theme-opt .sw i:nth-of-type(1){left:8px}.theme-opt .sw i:nth-of-type(2){left:22px}
.theme-opt input:checked + .sw{border-color:var(--ui-pri);transform:scale(1.04);box-shadow:0 0 0 3px rgba(232,70,124,.2)}
.theme-opt input:focus-visible + .sw{outline:2px solid var(--ui-pri);outline-offset:2px}

/* ---------- segmented / toggle ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:52px;padding:.4em;border:1.5px solid var(--ui-line);border-radius:14px;font-weight:600;background:#fff}
.seg input:checked + span{border-color:var(--ui-pri);background:var(--ui-soft);color:var(--ui-pri-d)}
.seg input:focus-visible + span{outline:2px solid var(--ui-pri);outline-offset:2px}
.seg.small span{min-height:42px;font-size:.92rem}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .track{width:48px;height:28px;border-radius:999px;background:#e4d7de;position:relative;transition:background .2s;flex:none}
.switch .track::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked + .track{background:var(--ui-pri)}
.switch input:checked + .track::after{transform:translateX(20px)}
.switch input:focus-visible + .track{outline:2px solid var(--ui-pri);outline-offset:2px}
.photo-thumb{width:52px;height:52px;border-radius:12px;background:center/cover no-repeat #eee;border:1px solid var(--ui-line)}

/* ---------- preview panel ---------- */
.preview h2{margin:0 0 12px;font-family:'Baloo Da 2',sans-serif;font-size:1.2rem;color:var(--ui-pri)}
.stage{display:flex;justify-content:center;align-items:center;background:repeating-conic-gradient(#faf3f6 0 25%,#fff 0 50%) 0 0/24px 24px;border-radius:18px;padding:14px}
#cardSlot{width:100%;max-width:420px}
#animCanvas{display:block;width:min(100%, calc(min(68vh,620px) * 9 / 16));height:auto;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);background:#000}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.actions .btn{flex:1 1 auto}
.rec{margin-top:10px;font-size:.9rem;color:var(--ui-sub)}
.rec .bar{height:8px;border-radius:99px;background:var(--ui-line);overflow:hidden;margin-bottom:4px}
.rec .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ui-pri),var(--ui-pri2));transition:width .2s linear}
.share-box{margin-top:16px;padding-top:14px;border-top:1px dashed var(--ui-line)}
.share-box h3{margin:0 0 8px;font-size:1.05rem}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.92rem;margin-bottom:10px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--ui-pri)}
.share-out{margin-top:10px;display:grid;gap:8px}
.share-out input{font-size:.85rem;min-height:42px}
.note{font-size:.82rem;color:var(--ui-sub);margin:10px 0 0}
.warn{font-size:.84rem;color:#9a5b00;background:#fff6e0;border-radius:10px;padding:.5em .7em;margin:0}
.jump-preview{
  position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;
  box-shadow:0 8px 24px rgba(232,70,124,.4);
}
@media (min-width:920px){.jump-preview{display:none!important}}
footer{text-align:center;color:var(--ui-sub);font-size:.85rem;padding:12px 16px 90px}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);z-index:300;
  background:#2b2233;color:#fff;padding:.7em 1.1em;border-radius:14px;max-width:min(92vw,460px);
  font-size:.95rem;opacity:0;pointer-events:none;transition:.3s;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- DOM confetti (intro, surprise) ---------- */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:250;overflow:hidden}
.confetti i{position:absolute;top:55%;width:10px;height:6px;border-radius:2px;animation:conf 2.4s cubic-bezier(.15,.7,.4,1) forwards}
@keyframes conf{
  0%{transform:translate(0,0) rotate(0);opacity:1}
  45%{transform:translate(calc(var(--dx)*.75),var(--dy)) rotate(var(--r))}
  100%{transform:translate(var(--dx),calc(var(--dy) + 75vh)) rotate(calc(var(--r)*2));opacity:0}
}

/* =====================================================================
   CSS PART 2 — INTRO (shop door opening + greeting)
   ===================================================================== */
#intro{position:fixed;inset:0;z-index:100;overflow:hidden;perspective:1400px;
  background:radial-gradient(circle at 50% 42%,#fff6dc 0,#ffd6e2 55%,#f7a8c4 100%);transition:opacity .7s, visibility .7s}
#intro.leaving{opacity:0;visibility:hidden}
.intro-sky{position:absolute;inset:0;z-index:0}
.intro-sky .ib{position:absolute;bottom:-90px;left:var(--x);width:48px;height:58px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.7) 0 7px,transparent 8px),var(--c);
  animation:rise 9s linear var(--d) infinite}
.intro-sky .ib::after{content:'';position:absolute;left:50%;top:100%;width:1px;height:50px;background:rgba(80,60,90,.35)}
@keyframes rise{to{transform:translateY(calc(-100vh - 160px)) translateX(30px)}}
.greet{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:90px 20px 30px;opacity:0}
#intro.opened .greet{animation:fadeUp 1s .9s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
.greet-badge{font-size:3rem;animation:bob 3s ease-in-out infinite}
.greet-title{margin:.1em 0 0;font-family:'Galada','Baloo Da 2',cursive;font-weight:400;font-size:clamp(2.6rem,11vw,5rem);line-height:1.1;
  color:#d62f62;text-shadow:0 3px 0 #fff,0 8px 24px rgba(214,47,98,.3)}
.greet-alt{margin:.2em 0 0;font-family:'Baloo Da 2',sans-serif;font-weight:600;color:#7a3c58;letter-spacing:.02em}
.greet-sub{margin:.6em 0 1.4em;max-width:30em;color:#5a3a4c;font-size:1.05rem}
.awning{position:absolute;top:0;left:0;right:0;height:74px;z-index:4;display:grid;place-items:center;
  background:linear-gradient(90deg,#e8467c 0 50%,#fff 50% 100%) 0 0/76px 100%;box-shadow:0 6px 14px rgba(0,0,0,.15);
  transition:transform .9s .6s cubic-bezier(.6,0,.3,1)}
.awning::after{content:'';position:absolute;left:0;right:0;bottom:-16px;height:16px;
  background:radial-gradient(circle at 19px 0,#e8467c 0 18px,transparent 19px) 0 0/76px 16px repeat-x}
.shop-name{background:#fff;color:#d62f62;font-family:'Galada','Baloo Da 2',cursive;font-size:1.35rem;padding:.15em .9em;border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);border:2px solid #d62f62;position:relative;z-index:1}
#intro.opened .awning{transform:translateY(-120%)}
.door{position:absolute;top:0;bottom:0;width:50%;z-index:3;
  background:linear-gradient(90deg,#86452a,#a85e37 45%,#8f4c2d);border:4px solid #5b2f18;
  transition:transform 1.7s cubic-bezier(.6,.05,.25,1);box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.door.left{left:0;transform-origin:left center}
.door.right{right:0;transform-origin:right center}
#intro.opened .door.left{transform:rotateY(-104deg)}
#intro.opened .door.right{transform:rotateY(104deg)}
.door .pane{position:absolute;top:16%;left:14%;right:14%;height:42%;border:10px solid #6e3a1f;border-radius:16px 16px 6px 6px;
  background:linear-gradient(135deg,rgba(255,255,255,.65),rgba(190,225,255,.3) 38%,rgba(255,255,255,.5) 55%,rgba(170,205,255,.25))}
.door .panel-low{position:absolute;top:64%;left:14%;right:14%;height:24%;border:7px solid #6e3a1f;border-radius:8px;box-shadow:inset 0 0 18px rgba(0,0,0,.25)}
.door .knob{position:absolute;top:56%;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c2,#e0b032 60%,#a3790f)}
.door.left .knob{right:8%}.door.right .knob{left:8%}
.open-sign{position:absolute;top:31%;left:50%;transform-origin:50% -24px;transform:translateX(-50%);background:#fff;color:#d62f62;
  border:3px solid #d62f62;font-weight:800;font-family:'Baloo Da 2',sans-serif;padding:.15em .8em;border-radius:8px;white-space:nowrap;
  animation:swing 2.4s ease-in-out infinite}
@keyframes swing{0%,100%{transform:translateX(-50%) rotate(-6deg)}50%{transform:translateX(-50%) rotate(6deg)}}
.door-hint{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;z-index:5;color:#fff;
  font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.5);transition:opacity .4s}
#intro.opened .door-hint{opacity:0}
.intro-lang{position:absolute;top:calc(84px + env(safe-area-inset-top));right:12px;z-index:10}
#intro.opened .intro-lang{top:calc(12px + env(safe-area-inset-top));transition:top .6s 1.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* =====================================================================
   CSS PART 3 — THE CARD + 6 THEMES (colors, fonts, animations)
   Base styles are always the final visible state; animations only add
   motion, so the PNG export (which turns animations off) looks right.
   ===================================================================== */
.card{
  position:relative;width:100%;aspect-ratio:4/5;border-radius:1.2em;overflow:hidden;isolation:isolate;margin:0 auto;
  font-size:17px;color:var(--c-text);box-shadow:0 14px 40px rgba(40,20,40,.22);
  --c-text:#222;--c-sub:#555;--c-accent:#e8467c;--c-accent2:#2f8fe0;--pill-text:#fff;
  --f-title:'Baloo Da 2',sans-serif;--w-title:800;--s-title:normal;--f-body:'Hind Siliguri',sans-serif;--f-name:'Baloo Da 2',sans-serif;--w-name:800;
  --msg-bg:rgba(255,255,255,.65);--shade:rgba(255,255,255,.6);
}
.card-bg,.card-photo-bg,.card-shade,.card-deco{position:absolute;inset:0}
.card-bg{z-index:0}
.card-photo-bg{z-index:1;display:none;background-size:cover;background-position:center}
.card-shade{z-index:1;display:none;background:var(--shade)}
.card.has-photobg .card-photo-bg,.card.has-photobg .card-shade{display:block}
.card-deco{z-index:2;pointer-events:none;overflow:hidden}
.card-body{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:2.6em 1.7em 2em;gap:.3em}
.c-salute{font:600 1em/1.3 var(--f-body);color:var(--c-sub)}
.c-title{font-family:var(--f-title);font-weight:var(--w-title);font-style:var(--s-title);font-size:2.6em;line-height:1.15;color:var(--c-accent);margin:.02em 0}
.c-milestone{background:var(--c-accent2);color:var(--pill-text);font:600 .9em/1 var(--f-body);padding:.5em 1em .4em;border-radius:999px}
.c-frame{display:none;width:6em;height:6em;border-radius:50%;background-size:cover;background-position:center;border:.25em solid #fff;
  box-shadow:0 0 0 .18em var(--c-accent),0 .5em 1.2em rgba(0,0,0,.2);margin:.3em 0;flex:none}
.card.has-frame .c-frame{display:block}
.c-name{font-family:var(--f-name);font-weight:var(--w-name);font-size:2.1em;line-height:1.15;color:var(--c-text);overflow-wrap:anywhere}
.c-name.is-placeholder{opacity:.4}
.c-nick{font:italic 400 1em/1.3 var(--f-body);color:var(--c-sub)}
.c-msg{font:400 1em/1.6 var(--f-body);color:var(--c-text);background:var(--msg-bg);padding:.7em 1em;border-radius:.8em;margin:.4em 0 .2em;
  white-space:pre-line;max-width:100%;overflow-wrap:anywhere}
.card.msg-long .c-msg{font-size:.88em}
.card.msg-xlong .c-msg{font-size:.76em}
.card.has-frame.msg-long .c-frame{width:4.6em;height:4.6em}
.c-from{font:600 1em/1.3 var(--f-body);color:var(--c-accent2)}
/* turn all motion off (used for PNG export) */
.no-anim,.no-anim *{animation:none!important;transition:none!important}

/* ---- THEME 1: Balloons ---- */
.theme-balloons{--c-text:#2a2340;--c-sub:#5a5270;--c-accent:#e8467c;--c-accent2:#2f8fe0;
  --f-title:'Baloo Da 2','Hind Siliguri',sans-serif;--w-title:800;--f-body:'Baloo Da 2','Hind Siliguri',sans-serif;--f-name:'Baloo Da 2',sans-serif;--w-name:800;
  --msg-bg:rgba(255,255,255,.72);--shade:rgba(255,255,255,.62)}
.theme-balloons .card-bg{background:radial-gradient(circle,rgba(255,255,255,.6) 0 2px,transparent 3px) 0 0/22px 22px,linear-gradient(160deg,#ffe3ef,#d9f1ff 60%,#fff6d6)}
.d-bunting{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-around;padding:0 .4em}
.d-bunting::before{content:'';position:absolute;top:.2em;left:0;right:0;height:1px;background:rgba(60,50,80,.3)}
.d-bunting i{width:0;height:0;border-left:.75em solid transparent;border-right:.75em solid transparent;border-top:1.3em solid var(--fc);margin-top:.2em;
  transform-origin:top center;animation:flag 2.6s ease-in-out var(--d) infinite}
@keyframes flag{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.d-balloon{position:absolute;left:var(--x);top:var(--y);width:calc(2.4em * var(--s));height:calc(2.9em * var(--s));border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75) 0 .3em,transparent .35em),var(--bc);animation:bob 4.5s ease-in-out var(--d) infinite}
.d-balloon::after{content:'';position:absolute;left:50%;top:100%;width:1px;height:2.6em;background:rgba(60,50,80,.35)}

/* ---- THEME 2: Cake ---- */
.theme-cake{--c-text:#4a2a22;--c-sub:#7a5248;--c-accent:#c2416b;--c-accent2:#7b3f2a;
  --f-title:'Galada','Baloo Da 2',cursive;--w-title:400;--f-body:'Hind Siliguri',sans-serif;--f-name:'Galada','Baloo Da 2',cursive;--w-name:400;
  --msg-bg:rgba(255,250,245,.8);--shade:rgba(255,244,230,.66)}
.theme-cake .card-bg{background:radial-gradient(circle,rgba(194,65,107,.12) 0 3px,transparent 4px) 0 0/30px 30px,linear-gradient(180deg,#fff4e6,#ffe6ee 60%,#fde2cf)}
.d-drips{position:absolute;top:0;left:0;right:0;height:2.6em;
  background:radial-gradient(circle at 50% 0,#6b3a2a 0 .95em,transparent 1em) 0 .7em/2.2em 2em repeat-x,linear-gradient(#6b3a2a,#6b3a2a) 0 0/100% .8em no-repeat}
.d-sprinkle{position:absolute;left:var(--x);top:var(--y);width:.9em;height:.28em;border-radius:.2em;background:var(--bc);transform:rotate(var(--r));

/* =====================================================================
   CSS PART 4 — SURPRISE OVERLAY (cake cutting / envelope)
   ===================================================================== */
#surprise{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  background:radial-gradient(circle at 50% 40%,var(--sp1,#fff3e6),var(--sp2,#f7a8c4));opacity:0;transition:opacity .5s;cursor:pointer;
  -webkit-tap-highlight-color:transparent;padding:20px}
#surprise.in{opacity:1}
#surprise.out{opacity:0}
.sp-hint{margin:0;font-family:'Baloo Da 2','Hind Siliguri',sans-serif;font-weight:800;font-size:1.25rem;color:var(--sph,#7a2a4a);text-align:center;
  background:rgba(255,255,255,.75);padding:.4em 1em;border-radius:999px;animation:bob 2s ease-in-out infinite;transition:opacity .3s}
#surprise.blown .sp-hint,#surprise.open .sp-hint{opacity:0}
.sp-cake,.sp-env{display:none}
#surprise[data-style="cake"] .sp-cake{display:block}
#surprise[data-style="envelope"] .sp-env{display:block}
/* cake: built as two halves so it can be "cut" */
.sp-cake{position:relative;width:260px;height:300px;transform:scale(var(--sps,1))}
.sp-cake .half{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;transition:transform .8s cubic-bezier(.3,1.5,.5,1)}
.sp-cake .half.l{left:0}.sp-cake .half.r{right:0}
.sp-cake .inner{position:absolute;top:0;width:260px;height:100%}
.sp-cake .half.l .inner{left:0}.sp-cake .half.r .inner{right:0}
.sp-cake .candle{position:absolute;top:44px;width:14px;height:56px;border-radius:4px;background:repeating-linear-gradient(45deg,#fff 0 6px,#5ec2ff 6px 12px)}
.sp-cake .flame{position:absolute;left:50%;top:-30px;width:16px;height:28px;margin-left:-8px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 70%,#fff7b0,#ffb703 45%,#ff5d1f 85%);box-shadow:0 0 16px 6px rgba(255,190,60,.55);
  transform-origin:50% 90%;animation:flicker .14s ease-in-out infinite alternate;transition:transform .35s, opacity .35s}
@keyframes flicker{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.9,1.1) rotate(2deg)}}
#surprise.blown .flame{animation:none;transform:scale(0);opacity:0}
.sp-cake .candle::after{content:'';position:absolute;left:3px;top:-14px;width:8px;height:8px;border-radius:50%;background:rgba(140,140,140,.6);opacity:0}
#surprise.blown .candle::after{animation:smoke 1.3s ease-out forwards}
@keyframes smoke{0%{opacity:.8;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(3)}}
.sp-cake .tier{position:absolute;border-radius:14px 14px 8px 8px}
.sp-cake .tier::before{content:'';position:absolute;left:0;right:0;top:0;height:24px;border-radius:14px 14px 0 0;
  background:radial-gradient(circle at 50% 100%,var(--frost) 0 9px,transparent 10px) 0 6px/24px 22px repeat-x,linear-gradient(var(--frost),var(--frost)) 0 0/100% 14px no-repeat}
.sp-cake .tier.top{left:45px;width:170px;top:100px;height:72px;background:var(--cake2)}
.sp-cake .tier.bot{left:10px;width:240px;top:172px;height:96px;background:radial-gradient(circle,rgba(255,255,255,.7) 0 3px,transparent 4px) 0 30px/26px 22px,var(--cake1)}
.sp-cake .plate{position:absolute;left:-6px;width:272px;top:258px;height:26px;border-radius:50%;background:#efe9f3;box-shadow:0 6px 14px rgba(0,0,0,.15)}
.sp-cake .knife{position:absolute;left:50%;top:-40px;width:18px;height:170px;margin-left:-9px;z-index:5;opacity:0;
  background:linear-gradient(90deg,#c3ccd6,#f7f9fb 50%,#a9b3be);border-radius:3px 3px 3px 60%}
.sp-cake .knife::before{content:'';position:absolute;left:-3px;top:-46px;width:24px;height:52px;border-radius:8px;background:#7b3f2a}
#surprise.cut .knife{animation:knife .9s ease-in forwards}
@keyframes knife{0%{transform:translateY(-60px);opacity:0}20%{opacity:1}70%{transform:translateY(130px);opacity:1}100%{transform:translateY(130px);opacity:0}}
#surprise.split .half.l{transform:translateX(-28px) rotate(-5deg)}
#surprise.split .half.r{transform:translateX(28px) rotate(5deg)}
/* envelope */
.sp-env{position:relative;width:300px;height:200px;transform:scale(var(--sps,1));perspective:800px}
.sp-env .env{position:absolute;inset:0;animation:wobble 1.8s ease-in-out infinite}
#surprise.open .env{animation:none}
@keyframes wobble{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.env-back{position:absolute;inset:0;border-radius:10px;background:var(--env2,#e8467c)}
.letter{position:absolute;left:14px;right:14px;top:10px;height:180px;z-index:2;background:#fffdf8;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;color:#c2416b;
  font-family:'Galada','Baloo Da 2',cursive;font-size:1.5rem;line-height:1.25;transition:transform .9s cubic-bezier(.2,.9,.3,1.15)}
.letter small{font-family:'Hind Siliguri',sans-serif;font-size:.85rem;color:#7a5a66}
.env-front{position:absolute;inset:0;z-index:3;border-radius:10px;background:var(--env1,#ff7aa2);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%)}
.env-flap{position:absolute;left:0;right:0;top:0;height:62%;z-index:4;background:var(--env3,#d62f62);clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;transition:transform .6s ease,z-index 0s .3s}
.seal{position:absolute;left:50%;top:56%;z-index:5;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#b8123f;color:#fff;
  display:grid;place-items:center;font-size:1.3rem;box-shadow:0 3px 8px rgba(0,0,0,.3);transition:.3s}
#surprise.open .seal{opacity:0;transform:scale(.3)}
#surprise.open .env-flap{transform:rotateX(180deg);z-index:1}
#surprise.rise .letter{transform:translateY(-62%) scale(1.06)}

/* =====================================================================
   CSS PART 5 — SHARE VIEWER (clean fullscreen output only)
   ===================================================================== */
#viewer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px 16px 84px;overflow:hidden}
.viewer-stage{opacity:0;transform:scale(.94);transition:opacity .8s, transform .8s cubic-bezier(.2,.9,.3,1.2);display:flex;justify-content:center;width:100%}

@media (prefers-reduced-motion:reduce){
  .intro-sky .ib,.d-balloon,.d-petal,.d-star,.d-grid,.d-sprinkle{animation:none!important}
}

function fileSafe(s) { return (s || 'wish').trim().replace(/[\\/:*?"<>|\s]+/g, '-').slice(0, 40) || 'wish'; }
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* UTF-8 safe base64url (for the share link) */
function b64urlEncode(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64urlToB64(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return s; }
function b64urlDecode(s) { const bin = atob(b64urlToB64(s)); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }

/* Text helpers shared by card + animation */

/* "25" -> "২৫তম জন্মদিন" / "25th Birthday"; any other text is shown as typed */
function milestone(s) {
  const a = (s.age || '').trim(); if (!a) return '';
  if (!/^\d{1,3}$/.test(a)) return a;
  const n = +a;
  if (s.lang === 'bn') {
    const suf = n === 1 ? 'ম' : (n === 2 || n === 3) ? 'য়' : n === 4 ? 'র্থ' : n === 6 ? 'ষ্ঠ' : (n >= 5 && n <= 10) ? 'ম' : 'তম';
    return bnNum(n) + suf + ' জন্মদিন';
  }
  const sfx = (n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({1:'st',2:'nd',3:'rd'}[n % 10] || 'th');
  return n + sfx + ' Birthday';
}

function createCard(id) {
  const el = document.createElement('div');
  el.className = 'card'; if (id) el.id = id;
  el.innerHTML = '<div class="card-bg"></div><div class="card-photo-bg"></div><div class="card-shade"></div><div class="card-deco" aria-hidden="true"></div>' +
    '<div class="card-body"><div class="c-salute"></div><div class="c-title"></div><div class="c-milestone"></div><div class="c-frame"></div>' +
    '<div class="c-name"></div><div class="c-nick"></div><p class="c-msg"></p><div class="c-from"></div></div>';
  // All card sizes are in em, so scaling the font scales the whole card.
  const fit = () => { if (el.clientWidth) el.style.fontSize = (el.clientWidth / 24) + 'px'; };
  if (window.ResizeObserver) new ResizeObserver(fit).observe(el); else window.addEventListener('resize', fit);
  requestAnimationFrame(fit);
  return el;
}

/* Decorations for each theme (seeded, so the PNG matches the preview) */
function buildDeco(theme) {
  const R = mulberry32(7), P = THEMES[theme], C = P.colors; let h = '';
  const f = n => n.toFixed(2);
  switch (theme) {
    case 'balloons': {
      h += '<div class="d-bunting">' + Array.from({length: 9}, (_, i) => `<i style="--fc:${C[i % C.length]};--d:${f(-i * .3)}s"></i>`).join('') + '</div>';
      [[3,16],[86,11],[5,50],[87,44],[2,78],[85,76]].forEach(([x, y], i) => {
        h += `<i class="d-balloon" style="--x:${x}%;--y:${y}%;--bc:${C[i % C.length]};--s:${f(.75 + R() * .45)};--d:${f(-R() * 4)}s"></i>`;
      });
      break;
    }
    case 'cake': {
      h += '<div class="d-drips"></div>';
      for (let i = 0; i < 22; i++) {
        const side = i % 2 ? 2 + R() * 12 : 86 + R() * 10;
        h += `<i class="d-sprinkle" style="--x:${f(side)}%;--y:${f(12 + R() * 80)}%;--bc:${C[i % C.length]};--r:${Math.round(R() * 180)}deg;--d:${f(-R() * 9)}s"></i>`;
      }
      h += `<span class="d-emoji" style="--x:3%;--y:85%;--d:0s">🧁</span><span class="d-emoji" style="--x:83%;--y:85%;--d:-1.4s">🎂</span>`;
      break;
    }
    case 'floral': {
      [['🌸','-3%','-2%'],['🌺','82%','-1%'],['🌼','-2%','86%'],['🌷','84%','85%']].forEach(([e, x, y], i) => {
        h += `<span class="d-emoji" style="--x:${x};--y:${y};--fs:3.2em;--d:${f(-i * .8)}s">${e}</span>`;
      });
      for (let i = 0; i < 12; i++) {
        h += `<i class="d-petal" style="--x:${f(R() * 92)}%;--y:${f(R() * 90)}%;--bc:${C[i % 4]};--dur:${f(7 + R() * 6)}s;--d:${f(-R() * 12)}s"></i>`;
      }
      break;
    }
    case 'minimal':
      h += '<div class="d-frame"></div><div class="d-dot"></div>';
      break;
    case 'night': {
      for (let i = 0; i < 32; i++) {
        h += `<i class="d-star" style="--x:${f(R() * 98)}%;--y:${f(R() * 96)}%;--sz:${f(.12 + R() * .22)}em;--dur:${f(2 + R() * 3)}s;--d:${f(-R() * 4)}s"></i>`;
      }
      h += '<div class="d-moon"></div><i class="d-shoot"></i>';
      break;
    }
    case 'retro': {
      for (let i = 0; i < 14; i++) {
        h += `<i class="d-star" style="--x:${f(R() * 98)}%;--y:${f(R() * 36)}%;--sz:${f(.1 + R() * .15)}em;--dur:${f(2 + R() * 3)}s;--d:${f(-R() * 4)}s"></i>`;
      }
      h += '<div class="d-sun"></div><div class="d-grid"></div>';
      break;
    }
  }
  return h;
}

function renderCard(el, s, photo) {
  const theme = THEMES[s.theme] ? s.theme : 'balloons';
  const msg = finalMessage(s);
  const photoMode = photo ? (s.photoStyle === 'frame' ? ' has-frame' : ' has-photobg') : '';
  const lenCls = msg.length > 220 ? ' msg-xlong' : msg.length > 140 ? ' msg-long' : '';
  el.className = `card theme-${theme}${photoMode}${lenCls}`;
  const q = sel => el.querySelector(sel);
  const url = photo ? `url("${photo}")` : 'none';
  q('.card-photo-bg').style.backgroundImage = photo && s.photoStyle !== 'frame' ? url : 'none';
  q('.c-frame').style.backgroundImage = photo && s.photoStyle === 'frame' ? url : 'none';
  q('.c-salute').textContent = SALUTE[s.lang][s.rel];
  q('.c-title').textContent = tt('cardTitle', s.lang);
  const ms = milestone(s); q('.c-milestone').textContent = ms; q('.c-milestone').hidden = !ms;
  const nm = (s.name || '').trim();
  q('.c-name').textContent = nm || tt('nameFallback', s.lang);
  q('.c-name').classList.toggle('is-placeholder', !nm);
  const nick = (s.nick || '').trim();
  q('.c-nick').textContent = nick ? `“${nick}”` : ''; q('.c-nick').hidden = !nick;
  q('.c-msg').textContent = msg;
  const fr = fromLine(s); q('.c-from').textContent = fr; q('.c-from').hidden = !fr;
  if (el.dataset.deco !== theme) { q('.card-deco').innerHTML = buildDeco(theme); el.dataset.deco = theme; }
}

/* =====================================================================
   JS PART 6 — ANIMATION VIDEO (canvas, 720×1280, ~15–20 s)
   Every frame is drawn from the time value alone, so it can loop,
   update live while typing, and be recorded.
   ===================================================================== */
const W = 720, H = 1280;
const ease = {
  out: t => 1 - Math.pow(1 - t, 3),
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
};

function buildTimeline(s, skipSurprise) {
  const words = finalMessage(s).split(/\s+/).length;
  const list = [];
  if (s.surprise && !skipSurprise) list.push(['surprise', 3.2]);
  list.push(['greet', 3], ['name', 3.2], ['photo', 3.4], ['msg', clamp(3 + words * 0.12, 3.6, 5.5)], ['card', 3.8]);
  let at = 0;
  const scenes = list.map(([id, dur]) => { const o = {id, start: at, dur}; at += dur; return o; });
  return {scenes, total: at};
}

/* --- small drawing helpers --- */
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function setFont(c, o, size) { c.font = `${o.style || 'normal'} ${o.weight || 400} ${size}px ${o.font}`; }
function txt(c, str, x, y, o) {
  let size = o.size; setFont(c, o, size);
  if (o.maxW) while (size > 18 && c.measureText(str).width > o.maxW) { size -= 3; setFont(c, o, size); }
  c.textAlign = o.align || 'center'; c.textBaseline = 'middle';
  if (o.glow) { c.shadowColor = o.glow; c.shadowBlur = o.blur || 26; }
  else if (o.shadow) { c.shadowColor = o.shadow; c.shadowBlur = 10; c.shadowOffsetY = 3; }
  c.fillStyle = o.color; c.fillText(str, x, y);
  c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
  return size;
}
function wrapLines(c, text, maxW) {
  const out = [];
  String(text).split(/\n+/).forEach(para => {
    const words = para.trim().split(/\s+/).filter(Boolean); let line = [];
    words.forEach(w => {
      if (line.length && c.measureText([...line, w].join(' ')).width > maxW) { out.push(line); line = [w]; }
      else line.push(w);
    });
    if (line.length) out.push(line);
  });
  return out;
}
function drawCover(c, img, x, y, w, h, zoom = 1, pan = 0) {
  const iw = img.naturalWidth, ih = img.naturalHeight, sc = Math.max(w / iw, h / ih) * zoom;
  const dw = iw * sc, dh = ih * sc;
  c.drawImage(img, x + (w - dw) / 2 + pan * w, y + (h - dh) / 2, dw, dh);
}
const imgReady = img => img && img.complete && img.naturalWidth > 0;

function balloon(c, x, y, r, col, t, i) {
  c.save(); c.translate(x, y); c.rotate(Math.sin(t * 1.3 + i) * 0.08);
  c.strokeStyle = 'rgba(80,70,100,.35)'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(0, r * 1.25); c.quadraticCurveTo(12 * Math.sin(t * 2 + i), r * 2.1, 0, r * 3); c.stroke();
  c.fillStyle = col; c.beginPath(); c.ellipse(0, 0, r, r * 1.2, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.moveTo(-6, r * 1.3); c.lineTo(6, r * 1.3); c.lineTo(0, r * 1.15); c.fill();
  c.fillStyle = 'rgba(255,255,255,.45)'; c.beginPath(); c.ellipse(-r * .35, -r * .45, r * .17, r * .3, -.5, 0, Math.PI * 2); c.fill();

      if (fr) items.push({h: 54, d: y => txt(c, '— ' + fr, W / 2, y, {size: 36, font: p.fBody, weight: 600, color: p.accent2, maxW: pw - 60})});
      total = items.reduce((a, it) => a + it.h + 14, 0);
    };
    build();
    while (total > H - 220 && msgSize > 22) { msgSize -= 3; build(); }
    const ph = total + 100, ptop = (H - ph) / 2;
    c.fillStyle = p.panel; rr(c, px, ptop, pw, ph, 40); c.fill();
    c.save(); c.globalAlpha *= .45; c.strokeStyle = p.accent; c.lineWidth = 3; rr(c, px + 12, ptop + 12, pw - 24, ph - 24, 32); c.stroke(); c.restore();
    let y = ptop + 50;
    items.forEach((it, i) => {
      const a = ease.out(clamp((lt - .15 - i * .09) / .6));
      if (a > 0) { c.save(); c.globalAlpha *= a; it.d(y + it.h / 2 + (1 - a) * 30); c.restore(); }

    });

};

function drawFrame(c, t, s, img, skipSurprise) {
  const p = THEMES[s.theme] || THEMES.balloons, tl = buildTimeline(s, skipSurprise);
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1;
  drawBg(c, t, THEMES[s.theme] ? s.theme : 'balloons', p);
  const last = tl.scenes[tl.scenes.length - 1];
  const sc = tl.scenes.find(x => t < x.start + x.dur) || last;
  const lt = t - sc.start;
  c.globalAlpha = clamp(lt / .45) * (sc === last ? 1 : clamp((sc.start + sc.dur - t) / .45));
  SCENES[sc.id](c, lt, sc.dur, s, p, img);
  c.globalAlpha = 1;
  tl.scenes.forEach(x => {
    if (x.id === 'greet') confettiBurst(c, t - x.start - .15, 3, W / 2, H * .95, p.colors);
    if (x.id === 'card') confettiBurst(c, t - x.start - .2, 7, W / 2, H * .95, p.colors);
    if (x.id === 'surprise') confettiBurst(c, t - x.start - 1.8, 11, W / 2, H * .7, p.colors);
  });
  c.restore();
}

/* Plays the animation on a canvas with requestAnimationFrame */
class Player {
  constructor(canvas, skipSurprise = false) {
    this.cv = canvas; this.c = canvas.getContext('2d'); this.skip = skipSurprise;
    this.raf = 0; this.t0 = 0; this.loop = false; this.ended = false; this.onEnd = null;
    this.tick = this.tick.bind(this);
  }
  play({loop = false, onEnd = null} = {}) {
    this.loop = loop; this.onEnd = onEnd; this.ended = false; this.t0 = performance.now();
    if (!this.raf) this.raf = requestAnimationFrame(this.tick);
  }
  stop() { cancelAnimationFrame(this.raf); this.raf = 0; }
  get running() { return !!this.raf; }
  time() { return (performance.now() - this.t0) / 1000; }
  total() { return buildTimeline(state, this.skip).total; }
  tick() {
    this.raf = requestAnimationFrame(this.tick);
    let t = this.time(); const total = this.total();
    if (t >= total) {
      if (this.loop && t >= total + 1.8) { this.t0 = performance.now(); t = 0; }
      else if (!this.loop && !this.ended) { this.ended = true; if (this.onEnd) this.onEnd(); }
    }
    if (!document.hidden || recording) drawFrame(this.c, t, state, photoImg, this.skip);
  }
}

const Music = (() => {
  let ctx = null, master = null, recDest = null, timer = null, step = 0, nextT = 0;
  let current = 'none', playing = false;
  const customEl = new Audio(); customEl.loop = true; customEl.preload = 'auto';
  let customNode = null, hasCustom = false;
  const listeners = [];

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    ctx = new AC(); master = ctx.createGain(); master.gain.value = .55; master.connect(ctx.destination);
    if (ctx.createMediaStreamDestination) { recDest = ctx.createMediaStreamDestination(); master.connect(recDest); }
    return true;
  }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  function voice(type, m, t, dur, vol) {
    const f = hz(m), g = ctx.createGain(), o = ctx.createOscillator();
    let out = g; g.connect(master);
    o.frequency.value = f;
    if (type === 'bell') {
      o.type = 'sine';
      const o2 = ctx.createOscillator(), g2 = ctx.createGain(); o2.type = 'sine'; o2.frequency.value = f * 3; g2.gain.value = .22;
      o2.connect(g2); g2.connect(g); o2.start(t); o2.stop(t + dur + .1);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    } else if (type === 'pluck') {
      o.type = 'triangle';
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    } else if (type === 'chip' || type === 'chipbass') {
      o.type = 'square';
      g.gain.setValueAtTime(vol, t); g.gain.setValueAtTime(vol, t + dur * .7); g.gain.linearRampToValueAtTime(.0001, t + dur);
    } else if (type === 'pad') {
      o.type = 'sawtooth';
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; o.connect(lp); lp.connect(g); out = null;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .5); g.gain.linearRampToValueAtTime(vol * .8, t + dur * .7); g.gain.linearRampToValueAtTime(.0001, t + dur);
    } else { // 'bass' / 'soft'
      o.type = type === 'bass' ? 'triangle' : 'sine';
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    }
    if (out) o.connect(g);
    o.start(t); o.stop(t + dur + .1);
  }

  function playStep(tr, n, t, sd) {
    const total = tr.bars.length * tr.spb, s = n % total, bar = tr.bars[Math.floor(s / tr.spb)], i = s % tr.spb;
    const m = tr.melody[s]; if (m) voice(tr.lead, m, t, sd * 1.9, tr.leadVol);
    const a = tr.arp[i]; if (a != null) voice(tr.arpType, bar.chord[a % bar.chord.length] + 12, t, sd * 1.5, tr.arpVol);
    if (tr.bassMode === 'eighths') { if (i % 2 === 0) voice(tr.bassType, bar.bass, t, sd * .9, tr.bassVol); }
    else if (tr.bassMode === 'half') { if (i === 0 || i === tr.spb / 2) voice(tr.bassType, bar.bass, t, sd * tr.spb / 2 * .95, tr.bassVol); }
    else if (i === 0) voice(tr.bassType, bar.bass, t, sd * tr.spb * .95, tr.bassVol);
    if (tr.padVol && i === 0) bar.chord.forEach(nn => voice('pad', nn, t, sd * tr.spb, tr.padVol));
  }
  function scheduler() {
    const tr = TRACKS[current]; if (!tr) return;
    const sd = 60 / tr.bpm / 2; // one step = an eighth note
    while (nextT < ctx.currentTime + .15) { playStep(tr, step, nextT, sd); nextT += sd; step++; }
  }
  function emit() { listeners.forEach(fn => fn()); }

  function stop() {
    clearInterval(timer); timer = null;
    customEl.pause();
    playing = false; emit();
  }
  function play(id) {
    if (!id || id === 'none') { stop(); return; }
    if (id === 'custom' && !hasCustom) id = 't1';
    if (!init()) return;
    stop();
    current = id; playing = true;
    if (id === 'custom') {
      if (!customNode) { try { customNode = ctx.createMediaElementSource(customEl); customNode.connect(master); } catch (e) {} }
      customEl.currentTime = 0;
      customEl.play().catch(() => { playing = false; emit(); toast(tt('audioFail')); });
    } else {
      step = 0; nextT = ctx.currentTime + .06; scheduler(); timer = setInterval(scheduler, 25);
    }
    emit();
  }
  function setCustom(file) {
    if (customEl.src) URL.revokeObjectURL(customEl.src);
    customEl.src = URL.createObjectURL(file); hasCustom = true;
  }
  return {
    init, play, stop, setCustom,
    toggle(id) { playing ? stop() : play(id); },
    isPlaying: () => playing, current: () => current, hasCustom: () => hasCustom,
    stream: () => recDest ? recDest.stream : null,
    onChange: fn => listeners.push(fn)
  };
})();

function runSurprise(s, {onTap, onDone} = {}) {
  const ov = $('#surprise'), p = THEMES[s.theme] || THEMES.balloons;

  ov.style.setProperty('--env1', p.colors[0]); ov.style.setProperty('--env2', p.accent); ov.style.setProperty('--env3', p.colors[1 % p.colors.length]);
  ov.style.setProperty('--sps', Math.min(1.3, (window.innerWidth - 40) / 300).toFixed(2));

  $('#letterSub').textContent = tt('letterFor', s.lang);
  ov.hidden = false; void ov.offsetWidth; ov.classList.add('in'); ov.focus({preventScroll: true});
  let done = false;
  const finish = () => { ov.classList.add('out'); setTimeout(() => { ov.hidden = true; ov.className = ''; if (onDone) onDone(); }, 550); };
  const go = e => {
    if (e && e.type === 'keydown' && !['Enter', ' '].includes(e.key)) return;
    if (done) return; done = true;
    ov.removeEventListener('click', go); ov.removeEventListener('keydown', go);

      setTimeout(finish, 2800);
    } else {
      ov.classList.add('open');
      setTimeout(() => ov.classList.add('rise'), 650);
      setTimeout(() => confetti(90, p.colors), 1100);
      setTimeout(finish, 2700);
    }
  };
  ov.addEventListener('click', go); ov.addEventListener('keydown', go);
}

function loadImageFile(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    im.src = url;
  });
}
function downscale(im, max, q) {
  const sc = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const cv = document.createElement('canvas'); cv.width = Math.round(im.naturalWidth * sc); cv.height = Math.round(im.naturalHeight * sc);
  cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', q);
}

  player.play({loop: false});
  rec.start(250);
  const t0 = performance.now();
  const iv = setInterval(() => {
    const pct = Math.min(100, Math.round((performance.now() - t0) / 1000 / (total + .4) * 100));
    $('#recBar').style.width = pct + '%'; $('#recText').textContent = tt('recording').replace('{p}', state.lang === 'bn' ? bnNum(pct) : pct);
    if (pct >= 100) { clearInterval(iv); if (rec.state !== 'inactive') rec.stop(); }
  }, 200);
  await done;
  Music.stop();
  recording = false;
  $('#recBtn').disabled = $('#replayBtn').disabled = false; $('#recBox').hidden = true; $('#recBar').style.width = '0';
  player.play({loop: true});
  if (!chunks.length) { toast(tt('recFail')); return; }
  const type = rec.mimeType || mime || 'video/webm';
  const ext = type.includes('mp4') ? 'mp4' : 'webm';
  const name = `birthday-${fileSafe(state.name)}.${ext}`;
  download(new Blob(chunks, {type: type.split(';')[0]}), name);
  toast(tt('recDone').replace('{f}', ext.toUpperCase()), 3500);
}

/* =====================================================================
   JS PART 11 — SHARE LINK (data in the URL, no server)
   ?w=<base64url JSON>   and, if chosen, #p=<tiny photo>
   ===================================================================== */
function packState(s) {
  return b64urlEncode(JSON.stringify({
    v: 1, l: s.lang, n: s.name.trim(), k: s.nick.trim(), f: s.sender.trim(), r: s.rel, a: s.age.trim(), m: s.msg.trim(),
    t: s.theme, ps: s.photoStyle, mu: s.music === 'custom' ? 't1' : s.music, o: s.output, su: s.surprise ? 1 : 0, ss: s.surpriseStyle
  }));
}
function unpack(str) {
  try {
    const o = JSON.parse(b64urlDecode(str));
    const S = (v, n) => typeof v === 'string' ? v.slice(0, n) : '';
    const pick = (v, arr, d) => arr.includes(v) ? v : d;
    const s = {
      lang: pick(o.l, ['bn', 'en'], 'bn'), name: S(o.n, 40), nick: S(o.k, 30), sender: S(o.f, 40), rel: pick(o.r, RELS, 'other'),
      age: S(o.a, 30), msg: S(o.m, 300), theme: pick(o.t, THEME_KEYS, 'balloons'), photoStyle: pick(o.ps, ['bg', 'frame'], 'bg'),
      music: pick(o.mu, ['none', 't1', 't2', 't3', 't4'], 'none'), output: pick(o.o, ['card', 'video'], 'card'),
      surprise: !!o.su, surpriseStyle: pick(o.ss, ['cake', 'envelope'], 'cake')
    };
    return s.name.trim() ? s : null;
  } catch (e) { return null; }
}
function buildShareLink() {
  const base = location.href.split(/[?#]/)[0];
  let url = base + '?w=' + packState(state);
  if ($('#incPhoto').checked && photoSmall) url += '#p=' + photoSmall;
  return url;
}
function refreshShare() {
  const url = buildShareLink();
  $('#shareUrl').value = url;
  $('#waBtn').href = 'https://wa.me/?text=' + encodeURIComponent(tt('waText') + ' ' + url);
  $('#fbBtn').href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url);
  $('#openLink').href = url;
  const warns = [];
  if (location.protocol === 'file:') warns.push(tt('fileWarn'));
  if (state.music === 'custom') warns.push(tt('customWarn'));
  if (url.length > 8000) warns.push(tt('longWarn'));
  $('#shareWarn').textContent = warns.join(' '); $('#shareWarn').hidden = !warns.length;
  return url;
}
function makeLink() {
  readForm(); if (!validateName()) return;
  $('#shareOut').hidden = false; refreshShare();
  $('#nativeShare').hidden = !navigator.share;
}
async function copyLink() {
  const url = $('#shareUrl').value;
  try { await navigator.clipboard.writeText(url); }
  catch (e) { const i = $('#shareUrl'); i.select(); try { document.execCommand('copy'); } catch (e2) {} }
  toast(tt('copied'));
}
async function nativeShare() {
  try { await navigator.share({title: tt('cardTitle') + '!', text: tt('waText'), url: $('#shareUrl').value}); } catch (e) {}
}

/* =====================================================================
   JS PART 12 — SHARE VIEWER (output only, fullscreen)
   ===================================================================== */
function startViewer(data) {
  document.documentElement.classList.add('share-mode');
  document.body.classList.remove('lock');
  $('#intro').hidden = true; $('#app').hidden = true;
  const v = $('#viewer'); v.hidden = false;
  if (!data) {
    $('#viewerStage').innerHTML = `<div class="viewer-err">${tt('viewerErr')}</div>`;
    $('#viewerStage').classList.add('show'); return;
  }
  Object.assign(state, data);
  const m = location.hash.match(/[#&]p=([A-Za-z0-9_-]+)/);
  if (m) { photoData = 'data:image/jpeg;base64,' + b64urlToB64(m[1]); photoImg = new Image(); photoImg.src = photoData; }
  document.documentElement.lang = state.lang;
  document.title = `${tt('cardTitle')}, ${displayName(state)}!`;
  const p = THEMES[state.theme];
  v.style.background = `radial-gradient(120% 90% at 50% 20%, ${p.bg[0]}, ${p.bg[p.bg.length - 1]})`;
  loadThemeFonts(state.theme);
  const stage = $('#viewerStage');
  let vp = null;
  if (state.output === 'video') {
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H; cv.className = 'viewer-canvas';
    cv.setAttribute('aria-label', tt('cardTitle'));
    stage.appendChild(cv);
    vp = new Player(cv, true); // the DOM surprise replaces the canvas one here
    cv.addEventListener('click', () => vp.play({loop: false}));
    $('#vReplay').hidden = false; $('#vReplay').onclick = () => vp.play({loop: false});
  } else {
    const card = createCard(); stage.appendChild(card); renderCard(card, state, photoData);
  }
  const vm = $('#vMusic');
  if (state.music !== 'none') { vm.hidden = false; vm.onclick = () => Music.toggle(state.music); }
  updateMusicButtons();
  const reveal = () => { stage.classList.add('show'); if (vp) vp.play({loop: false}); };
  if (state.surprise) {
    buildSurpriseCake();
    runSurprise(state, {onTap: () => { if (state.music !== 'none') Music.play(state.music); }, onDone: reveal});
  } else reveal();
}

/* =====================================================================
   JS PART 13 — INTRO + START-UP
   ===================================================================== */
function runIntro() {
  const intro = $('#intro');
  const open = () => {
    if (intro.classList.contains('opened')) return;
    intro.classList.add('opened');
    setTimeout(() => confetti(70), 1200);
  };
  setTimeout(open, 900);
  intro.addEventListener('click', e => { if (!e.target.closest('button')) open(); });
  $('#startBtn').addEventListener('click', () => {
    intro.classList.add('leaving'); document.body.classList.remove('lock');
    setTimeout(() => { intro.hidden = true; }, 750);
    $('#fName').focus({preventScroll: true});
  });
}
function startBuilder() {
  restoreState();
  buildThemePicker(); buildSurpriseCake();
  $('#cardSlot').appendChild(createCard('card'));
  player = new Player($('#animCanvas'));
  writeForm();

  const form = $('#form');
  form.addEventListener('input', e => {
    if (e.target.type === 'file') return;
    readForm();
    if (e.target.id === 'fName' && state.name.trim()) { $('#fName').classList.remove('invalid'); $('#nameErr').hidden = true; }
    render();
  });
  form.addEventListener('change', e => {
    if (e.target.type === 'file') return;
    readForm();
    if (e.target.id === 'fMusic' && Music.isPlaying()) Music.play(state.music); // switch tracks live
    if (e.target.name === 'output' && state.output === 'video') player.play({loop: true});
    render();
  });
  $$('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  $('#suggestBtn').addEventListener('click', suggestMessage);
  $('#fPhoto').addEventListener('change', onPhoto);
  $('#removePhoto').addEventListener('click', removePhoto);
  $('#fAudio').addEventListener('change', onAudio);
  $('#musicToggle').addEventListener('click', () => {
    readForm();
    if (!Music.isPlaying() && state.music === 'none') { toast(tt('pickTrack')); $('#fMusic').focus(); return; }
    Music.toggle(state.music);
  });
  $('#pngBtn').addEventListener('click', exportPNG);
  $('#replayBtn').addEventListener('click', () => player.play({loop: true}));
  $('#recBtn').addEventListener('click', recordVideo);
  $('#trySurprise').addEventListener('click', () => {
    readForm();
    runSurprise(state, {
      onTap: () => { if (state.music !== 'none' && !Music.isPlaying()) Music.play(state.music); },
      onDone: () => { if (state.output === 'video') player.play({loop: true}); }
    });
  });
  $('#makeLink').addEventListener('click', makeLink);
  $('#incPhoto').addEventListener('change', () => { if (!$('#shareOut').hidden) refreshShare(); });
  $('#copyBtn').addEventListener('click', copyLink);
  $('#nativeShare').addEventListener('click', nativeShare);

  // Hide the floating "Preview" button while the preview is on screen
  if (window.IntersectionObserver) {
    new IntersectionObserver(([en]) => { $('#jumpPreview').style.opacity = en.isIntersecting ? 0 : 1; $('#jumpPreview').style.pointerEvents = en.isIntersecting ? 'none' : ''; },
      {threshold: .25}).observe($('#previewPanel'));
  }

  applyLang();
  runIntro();
}

(function init() {
  const w = new URLSearchParams(location.search).get('w');
  if (w !== null) startViewer(unpack(w));
  else startBuilder();
})();
</script>
